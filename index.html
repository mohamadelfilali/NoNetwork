<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد ديف | الرئيسية</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .post-card { background: #1e293b; padding: 20px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #334155; }
        .post-title { margin-top: 0; color: #38bdf8; }
        .post-date { font-size: 0.85em; color: #94a3b8; }
        .loading { text-align: center; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h1>المواضيع والدروس</h1>
    <div id="posts-container">
        <p class="loading">جاري تحميل المواضيع...</p>
    </div>
</div>

<script>
// رابط Web App الخاص بك في Google Apps Script
const API_URL = "https://script.google.com/macros/s/AKfycbzWrEkKqgB1wPjrZfdZ-nq64TvLC2RuhiDRtdish9HL1UrIS4hae_KGSlhMew0FWlCkmQ/exec";

// دالة لجلب المواضيع من Google Sheets
async function loadPosts() {
    const container = document.getElementById('posts-container');
    
    try {
        // طلب المواضيع عبر دالة GET
        const response = await fetch(`${API_URL}?action=getPosts`);
        const result = await response.json();

        if (result.status === "success" && result.data.length > 0) {
            container.innerHTML = ""; // تفريغ رسالة التحميل
            
            // تكرار عرض المواضيع
            result.data.forEach(post => {
                const postElement = document.createElement('article');
                postElement.className = 'post-card';
                postElement.innerHTML = `
                    <h2 class="post-title">${escapeHtml(post.title)}</h2>
                    <span class="post-date">${escapeHtml(post.date || '')}</span>
                    <p>${escapeHtml(post.summary || post.content.substring(0, 150))}</p>
                `;
                container.appendChild(postElement);
            });
        } else {
            container.innerHTML = "<p>لا توجد مواضيع منشورة حالياً.</p>";
        }
    } catch (error) {
        console.error("خطأ في جلب المواضيع:", error);
        container.innerHTML = "<p>حدث خطأ أثناء تحميل المواضيع. يرجى المحاولة لاحقاً.</p>";
    }
}

// دالة أمان لمنع هجمات XSS عند عرض النصوص
function escapeHtml(str) {
    return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// تشغيل الدالة عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', loadPosts);
</script>

</body>
</html>
